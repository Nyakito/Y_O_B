<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Year</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 30px;

    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 200, 0.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(120, 70, 255, 0.15), transparent 30%),
        linear-gradient(135deg, #070b14, #101827 50%, #080c15);

    color: white;
}


.heading {
    max-width: 700px;

    margin-bottom: 45px;

    text-align: center;

    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.1;

    background: linear-gradient(
        90deg,
        #ffffff,
        #7fffd4,
        #9b8cff,
        #ffffff
    );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: gradientMove 6s linear infinite;

    text-shadow: 0 0 35px rgba(127, 255, 212, 0.15);
}


label {
    margin-bottom: 12px;

    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;

    color: #9ca8bb;
}


.age {
    width: min(350px, 85vw);
    height: 60px;

    padding: 0 22px;

    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;

    outline: none;

    background: rgba(255, 255, 255, 0.06);

    color: white;

    font-size: 1.2rem;
    font-weight: 600;

    text-align: center;

    backdrop-filter: blur(15px);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 15px 40px rgba(0, 0, 0, 0.25);

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease,
        background 0.3s ease;
}


.age::placeholder {
    color: #687386;
}

.age:focus {
    border-color: #7fffd4;

    background: rgba(127, 255, 212, 0.07);

    transform: translateY(-3px);

    box-shadow:
        0 0 0 4px rgba(127, 255, 212, 0.08),
        0 15px 45px rgba(0, 0, 0, 0.35),
        0 0 30px rgba(127, 255, 212, 0.08);
}


.submit {
    position: relative;

    width: min(350px, 85vw);
    height: 58px;

    margin-top: 25px;

    border: none;
    border-radius: 17px;

    background: linear-gradient(
        135deg,
        #7fffd4,
        #5ee7c5
    );

    color: #06110e;

    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        0 10px 30px rgba(127, 255, 212, 0.2);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.submit::before {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 60%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.45),
        transparent
    );

    transform: skewX(-20deg);

    transition: left 0.6s ease;
}


/* Hover */

.submit:hover {
    transform: translateY(-4px);

    box-shadow:
        0 15px 40px rgba(127, 255, 212, 0.3);
}

.submit:hover::before {
    left: 140%;
}


/* Click */

.submit:active {
    transform: translateY(1px);

    box-shadow:
        0 5px 15px rgba(127, 255, 212, 0.2);
}


#yearOfBirth {
    width: min(500px, 90vw);

    min-height: 80px;

    margin-top: 25px;
    padding: 25px 30px;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    border: 1px solid rgba(127, 255, 212, 0.15);
    border-radius: 20px;

    background: rgba(255, 255, 255, 0.045);

    backdrop-filter: blur(20px);

    color: #e9fff8;

    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.6;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

    animation: resultAppear 0.5s ease;
}

@keyframes gradientMove {

    0% {
        background-position: 0% center;
    }

    50% {
        background-position: 100% center;
    }

    100% {
        background-position: 0% center;
    }
}


@keyframes resultAppear {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {

    body {
        padding: 20px;
    }

    .heading {
        margin-bottom: 35px;
        letter-spacing: -1px;
    }

    .age,
    .submit {
        width: 90vw;
        max-width: 350px;
    }

    #yearOfBirth {
        width: 90vw;
        padding: 20px;
        font-size: 1rem;
    }
}
    </style>
</head>
<body>
    <h1 class="heading" id="ageHeading"></h1>
    <Label>Your Age</Label>
    <input type="text" class="age"> <br> <br>
    <button type="submit" class="submit">Submit</button> <br> <br>
    <section id="yearOfBirth"></section>
    <script src="script.js"></script>
</body>
</html>
